[package]
name = "thermite"
version = "0.1.0"
description = "Charts every hardware temperature sensor over time, with safe and throttle thresholds"
edition = "2021"

# `cargo build`, `cargo test` and `cargo clippy` here cover the app and `core`.
[workspace]
members = ["core"]
default-members = [".", "core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
thermite-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
