[package]
name = "thermal-monitor"
version = "0.1.0"
description = "Charts every hardware temperature sensor over time, with safe and throttle thresholds"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.13"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
