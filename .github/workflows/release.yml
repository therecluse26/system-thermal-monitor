# Publishes a GitHub release with .deb, .rpm and AppImage packages for each push to main.
# .github/scripts/plan-release.sh picks the version; .github/scripts/changelog.sh writes the notes.
name: Release

on:
  push:
    branches: [main]
    # Documentation-only pushes make no release. Their commits go into the next release's notes.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# One release at a time, in push order. A push during a release waits for it to finish.
# When several pushes wait, only the newest runs; its release includes all their commits.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Choose the version
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all commits and tags

      - id: plan
        run: .github/scripts/plan-release.sh >> "$GITHUB_OUTPUT"

  check:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: [plan, check]
    if: needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04 # the oldest glibc available, so the packages run on more distributions
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The fan daemon in the packages is a static musl binary.
      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl

      # tauri.release.conf.json builds the fan daemon and adds it to the packages.
      # The version goes in through --config too, so no commit is needed to bump it.
      - name: Build the packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # linuxdeploy runs without FUSE
        run: >-
          npm run tauri build -- --bundles deb,rpm,appimage
          --config src-tauri/tauri.release.conf.json
          --config "{\"version\":\"$VERSION\"}"

      # "Thermite_1.2.3_amd64.deb" becomes "thermite_1.2.3_amd64.deb".
      # The AppImage also goes up as "thermite_amd64.AppImage", a name without the version. So
      # releases/latest/download/thermite_amd64.AppImage is always the newest, for the NixOS module.
      - name: Collect the packages
        run: |
          mkdir release
          bundle=src-tauri/target/release/bundle
          for file in "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage; do
            name=${file##*/}
            cp "$file" "release/thermite${name#Thermite}"
          done
          cp "release/thermite_${VERSION}_amd64.AppImage" release/thermite_amd64.AppImage
          cd release
          sha256sum -- * > SHA256SUMS
          ls -l

      # linuxdeploy rewrites the ELF files in the AppImage's usr/bin, and a rewritten static
      # binary crashes. So the fan daemon lives in usr/libexec; this checks that it still runs.
      - name: Check the fan daemon in the packages
        run: |
          appimage=(release/*.AppImage)
          deb=(release/*.deb)
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/${appimage[0]}" --appimage-extract > /dev/null
          dpkg-deb -x "$GITHUB_WORKSPACE/${deb[0]}" deb
          for daemon in {squashfs-root,deb}/usr/libexec/thermite/thermite-fand; do
            usage=$("$daemon" 2>&1) || true
            if [[ $usage != "usage: thermite-fand <user>" ]]; then
              echo "$daemon does not run: $usage" >&2
              exit 1
            fi
          done

      - name: Write the release notes
        run: .github/scripts/changelog.sh "$PREVIOUS" "$TAG" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" release/*
          --target "$GITHUB_SHA"
          --title "Thermite $VERSION"
          --notes-file notes.md
