name: Set up the build tools
description: System libraries for Tauri, Node with the npm cache, stable Rust with the cargo cache, and the npm packages.

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install npm packages
      shell: bash
      run: npm ci
